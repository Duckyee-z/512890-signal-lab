name: Deploy 512890 signal lab

on:
  push:
    branches: [main]
  schedule:
    # UTC -> Asia/Shanghai 16:37, 18:37, 21:37 on weekdays.
    - cron: '37 8,10,13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Refresh closed adjusted daily prices
        run: python3 scripts/update-data.py --fetch
      - name: Verify market data ingestion
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify signal engine
        run: node --test tests/engine.test.mjs
      - name: Check browser JavaScript
        run: node --check dist/app.js
      - name: Persist latest validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/source-market.json dist/update-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 512890 daily market data"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
