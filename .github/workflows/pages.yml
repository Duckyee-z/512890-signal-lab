name: Deploy 512890 signal lab

on:
  push:
    branches: [main]
  schedule:
    # UTC -> Asia/Shanghai 16:37, 18:37, 21:37 on weekdays.
    - cron: '37 8 * * 1-5'
    - cron: '37 10 * * 1-5'
    - cron: '37 13 * * 1-5'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh closed adjusted daily prices
        run: python3 scripts/update-data.py --fetch
      - name: Verify market data ingestion
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify signal engine
        run: node --test tests/engine.test.mjs
      - name: Check browser JavaScript
        run: node --check dist/app.js
      - name: Persist latest validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/source-market.json dist/update-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 512890 daily market data"
            git push origin HEAD:main
          fi
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
